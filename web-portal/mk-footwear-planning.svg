<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 130" width="100%" height="100%">
  <defs>
    <linearGradient id="mkPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#153B66"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="mkBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="mkSoleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1E40AF" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- LOGO EMBLEM GROUP -->
  <g transform="translate(10, 8)" filter="url(#subtleGlow)">
    <!-- Base Icon Container (Rounded Hex/Shield Soft Background) -->
    <rect x="0" y="0" width="114" height="114" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="3" y="3" width="108" height="108" rx="21" fill="#F8FAFC"/>
    
    <!-- M Letterform: Precision Industrial Geometry -->
    <path d="M 16 90 L 16 32 L 30 32 L 45 62 L 60 32 L 74 32 L 74 90 L 61 90 L 61 54 L 49 78 L 41 78 L 29 54 L 29 90 Z" fill="url(#mkPrimaryGrad)"/>
    
    <!-- K Stem: Shared Vertical Anchor -->
    <path d="M 68 32 L 80 32 L 80 90 L 68 90 Z" fill="#153B66"/>
    
    <!-- K Upper Diagonal Arm -->
    <path d="M 78 58 L 95 32 L 108 32 L 88 62 Z" fill="url(#mkBlueGrad)"/>

    <!-- K Lower Arm & Aerodynamic Footwear Silhouette -->
    <!-- The lower leg morphs into an ergonomic sneaker silhouette (sole, heel counter & toe spring) -->
    <path d="M 78 57 L 91 74 C 95 72 101 70 106 72 C 109 73 111 76 109 79 C 105 84 96 85 86 86 C 81 86 76 87 71 89 L 68 89 L 75 72 L 78 57 Z" fill="url(#mkBlueGrad)"/>
    
    <!-- Dynamic Shoe Sole & Cushion Air Curve (Production Flow Line) -->
    <path d="M 52 92 C 65 92 78 90 89 87 C 98 84 106 81 108 77 C 106 79 97 82 87 84 C 74 86 62 87 52 87 Z" fill="url(#mkSoleGrad)"/>
    
    <!-- Planning / Flow Pulse Dots -->
    <circle cx="98" cy="40" r="3" fill="#38BDF8"/>
    <circle cx="106" cy="48" r="2" fill="#60A5FA"/>
  </g>

  <!-- BRAND TYPOGRAPHY -->
  <g transform="translate(142, 22)">
    <!-- Main Title -->
    <text x="0" y="44" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5" fill="#153B66">
      MK <tspan fill="#2563EB" font-weight="700">FOOTWEAR</tspan>
    </text>
    <text x="0" y="74" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="600" letter-spacing="1.5" fill="#334155">
      PLANNING
    </text>
    
    <!-- Tagline & Flow Divider -->
    <line x1="0" y1="84" x2="380" y2="84" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="18" cy="84" r="2.5" fill="#2563EB"/>
    <circle cx="155" cy="84" r="2.5" fill="#2563EB"/>
    <circle cx="280" cy="84" r="2.5" fill="#2563EB"/>
    
    <text x="0" y="99" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" letter-spacing="2.8" fill="#64748B">
      PLAN <tspan fill="#2563EB" font-weight="700">•</tspan> PRODUCE <tspan fill="#2563EB" font-weight="700">•</tspan> DELIVER
    </text>
  </g>
</svg>
